# Runs on every push and pull request: lint, the writing guide, types, and a
# full build, which also checks the site's kit version (prebuild).
# scripts/lint-writing.py is a copy; the source is forest-studio/scripts, and
# release.sh refreshes it here at each release.
name: checks

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Every word on the site follows the writing guide
        run: python3 scripts/lint-writing.py src
      - run: npx tsc --noEmit
      - run: npm run build
