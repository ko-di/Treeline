# Runs on every push and pull request: lint, types, and a full build, which
# also checks the site's kit version against the kit on GitHub (prebuild).
name: checks

on:
  push:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
